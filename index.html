<style>
:root{
  --bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f2;
  --pri:#4f46e5;--pri2:#7c3aed;--pri-s:#eef2ff;
  --ok:#059669;--ok-s:#d1fae5;--warn:#d97706;--warn-s:#fef3c7;--bad:#dc2626;--bad-s:#fee2e2;--info:#0284c7;--info-s:#e0f2fe;
  --r:16px;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
@media(max-width:560px){.hide-sm{display:none}}
html{-webkit-text-size-adjust:100%}
body{font-family:'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
body.noscroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:264px;flex:none;background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 100%);color:#cbd5e1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;z-index:50}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.brand-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;overflow:hidden;flex:none}
.brand-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand b{display:block;color:#fff;font-size:16px;line-height:1.3;word-break:break-word}
.brand small{color:#94a3b8;font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#cbd5e1;font-weight:600;text-align:right;transition:.2s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(-3px)}
.nav button.active{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.35)}
.side-foot{font-size:12px;color:#94a3b8;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.overlay{display:none}

/* Main */
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:20px;font-weight:800;flex:1}
.menu-btn{display:none}
.view{padding:24px 28px 48px;max-width:1280px;margin:0 auto;animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:700;transition:.2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.btn.pri:hover{box-shadow:0 10px 22px rgba(79,70,229,.4);transform:translateY(-1px)}
.btn.soft{background:var(--pri-s);color:var(--pri)}
.btn.soft:hover{background:#e0e7ff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:#f8fafc}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger:hover{background:#b91c1c}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--mut);transition:.15s}
.icon-btn:hover{background:var(--pri-s);color:var(--pri)}
.icon-btn.del:hover{background:var(--bad-s);color:var(--bad)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;border:1px solid rgba(229,233,242,.6)}
.card h2{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .ic{color:var(--pri)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.stat{display:flex;gap:14px;align-items:center;transition:.25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(15,23,42,.1)}
.stat .bub{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat .bub .ic{width:24px;height:24px}
.stat small{color:var(--mut);font-weight:600;display:block}
.stat b{font-size:21px;font-weight:800;display:block;line-height:1.3}
.stat em{font-style:normal;font-size:12px;color:var(--mut)}
.c-pri{background:var(--pri-s);color:var(--pri)}.c-ok{background:var(--ok-s);color:var(--ok)}.c-warn{background:var(--warn-s);color:var(--warn)}.c-bad{background:var(--bad-s);color:var(--bad)}.c-info{background:var(--info-s);color:var(--info)}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge.ok{background:var(--ok-s);color:var(--ok)}.badge.warn{background:var(--warn-s);color:var(--warn)}.badge.bad{background:var(--bad-s);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:700;font-size:13.5px;color:#334155}
.inp,select.inp,textarea.inp{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:.15s;outline:0}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.inp.err{border-color:var(--bad);box-shadow:0 0 0 4px rgba(220,38,38,.1)}
textarea.inp{resize:vertical;min-height:80px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1;min-width:160px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:720px}
.tbl th{background:#f8fafc;color:var(--mut);font-size:12.5px;font-weight:700;text-align:right;padding:12px 14px;white-space:nowrap}
.tbl th:first-child{border-radius:0 10px 10px 0}.tbl th:last-child{border-radius:10px 0 0 10px}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:.15s}.tbl tbody tr:hover{background:#fafbff}
.tbl tfoot td{font-weight:800;background:#f8fafc;border:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:2px;white-space:nowrap}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}
.empty .ic{width:46px;height:46px;color:#cbd5e1;margin-bottom:10px}
.empty p{margin-bottom:14px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--pri-s);color:var(--pri);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.banner{display:flex;gap:12px;align-items:center;background:var(--warn-s);color:#92400e;padding:14px 18px;border-radius:14px;margin-bottom:18px;font-weight:600;flex-wrap:wrap}
.progress{height:12px;background:#eef0f6;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34d399);border-radius:99px;transition:width .8s ease}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv span{color:var(--mut)}.kv b{font-weight:800}
.chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;min-width:0}
.chart .bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bar{width:34%;max-width:30px;min-height:3px;border-radius:8px 8px 3px 3px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.chart .b1{background:linear-gradient(180deg,var(--pri),var(--pri2))}.chart .b2{background:linear-gradient(180deg,#34d399,var(--ok))}
.chart small{color:var(--mut);font-size:12px;font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.tabs{display:inline-flex;background:#eef0f6;border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:8px 18px;border-radius:9px;font-weight:700;color:var(--mut);transition:.2s}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(15,23,42,.08)}

/* Items table (form) */
.items{width:100%;border-collapse:separate;border-spacing:0 8px}
.items th{font-size:12.5px;color:var(--mut);text-align:right;padding:0 6px 4px}
.items td{padding:0 4px;vertical-align:middle}
.items td.n{width:30px;color:var(--mut);font-weight:700;text-align:center}
.items td.tot{width:130px;font-weight:800;text-align:left;white-space:nowrap}
.totals-box{background:#f8fafc;border-radius:14px;padding:16px 18px}
.totals-box .kv.big{font-size:18px}
.totals-box .kv.big b{color:var(--pri)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{padding:8px 12px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--pri);color:#fff}

/* Modal */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .2s ease}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(15,23,42,.35);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:900px}.modal.sm{max-width:400px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:17px;font-weight:800}
.mbody{padding:20px 22px;overflow:auto;flex:1}
.mbody.center{text-align:center}
.mbody.center p{color:var(--mut);margin-top:6px}
.mfoot{display:flex;gap:10px;justify-content:flex-start;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.mic{width:60px;height:60px;border-radius:50%;margin:4px auto 12px;display:grid;place-items:center;background:var(--pri-s);color:var(--pri)}
.mic.bad{background:var(--bad-s);color:var(--bad)}.mic .ic{width:28px;height:28px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
#toasts{position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:calc(100vw - 40px)}
.toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:600;animation:slideIn .3s ease;display:flex;gap:10px;align-items:center}
.toast.ok{background:#047857}.toast.error{background:#b91c1c}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.logo-prev{width:90px;height:90px;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#fafbff;color:var(--mut);font-size:12px;text-align:center}
.logo-prev img{width:100%;height:100%;object-fit:contain}

/* Sheets (invoice / report) */
.sheet-wrap{background:#eef0f6}
.sheet{background:#fff;color:#111;max-width:210mm;margin:0 auto;padding:12mm 11mm;border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.65;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:3px solid #4f46e5}
.inv-brand{display:flex;gap:12px;align-items:center}
.inv-logo{width:72px;height:72px;object-fit:contain;border-radius:10px}
.inv-logo-ph{width:64px;height:64px;border-radius:14px;background:#4f46e5;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}
.inv-brand h2{font-size:20px;font-weight:800;color:#1e1b4b;line-height:1.3}
.inv-brand p{color:#555;font-size:12px}
.inv-title{text-align:left}
.inv-title h1{font-size:26px;font-weight:800;color:#4f46e5;line-height:1.2}
.inv-meta{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin-top:6px;font-size:12.5px;text-align:right}
.inv-meta span{color:#666}
.inv-cust{display:flex;justify-content:space-between;gap:16px;margin:16px 0;background:#f5f6fd;border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.inv-cust small{color:#666;display:block;font-size:11.5px}
.inv-cust b{font-size:14px}
.inv-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.inv-table th{background:#4f46e5;color:#fff;padding:8px 8px;font-size:12px;text-align:right}
.inv-table td{padding:8px;border-bottom:1px solid #e5e7eb;vertical-align:top}
.inv-table tr{break-inside:avoid}
.inv-table .c{text-align:center}.inv-table .l{text-align:left;white-space:nowrap}
.inv-table td small{color:#666;display:block;white-space:pre-wrap}
.inv-bottom{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;break-inside:avoid}
.inv-notes{flex:1;min-width:200px;font-size:12px;color:#444;white-space:pre-wrap}
.inv-notes b{display:block;color:#111;margin-bottom:2px}
.inv-totals{min-width:260px;border-collapse:collapse}
.inv-totals td{padding:6px 12px;border-bottom:1px solid #e5e7eb}
.inv-totals td:last-child{text-align:left;font-weight:700;white-space:nowrap}
.inv-totals tr.net td{background:#eef2ff;font-size:15px;font-weight:800;color:#312e81}
.inv-totals tr.rem td{background:#fef2f2;color:#b91c1c;font-weight:800}
.inv-totals tr.rem.zero td{background:#ecfdf5;color:#047857}
.inv-totals tr.fin td{background:#fffbeb;color:#92400e;font-weight:800}
.inv-sign{display:flex;justify-content:space-around;gap:20px;margin-top:34px;break-inside:avoid}
.inv-sign div{width:40%;text-align:center;border-top:1.5px solid #999;padding-top:6px;color:#555;font-size:12px;height:70px}
.inv-foot{text-align:center;margin-top:18px;padding-top:10px;border-top:1px dashed #ccc;color:#555;font-size:12px}
.rep-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.rep-sum div{background:#f5f6fd;border-radius:10px;padding:10px 12px}
.rep-sum small{display:block;color:#666;font-size:11.5px}.rep-sum b{font-size:15px}
.sheet h3.sec{margin:18px 0 8px;font-size:14px;color:#1e1b4b}
.st-table th,.st-table td{font-size:11.5px;padding:5px 6px}
.st-table tr.st-first td{border-top:2px solid #c7d2fe}
.st-table td.dim{color:#555;white-space:nowrap}
.st-table .bal{font-weight:700;white-space:nowrap}
.st-table .u{font-size:10px;color:#666;font-weight:400}
.st-table tr.st-open td{background:#f5f6fd;font-weight:700}
.st-table tr.st-adj td{color:#444}
@media print{.st-table thead{display:table-header-group}.st-table tr{break-inside:avoid}}

@media print{#gate{display:none!important}}

}

<script>
(()=>{
'use strict';

/* ============ Constants & helpers ============ */
const KEY='acc_invoice_app_v1';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ST={paid:['مدفوع','ok'],partial:['مدفوع جزئياً','warn'],unpaid:['غير مدفوع','bad']};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const toEn=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/[٬,]/g,'');
const parseNum=v=>{const s=toEn(v).trim();if(s===''||!/^(\d+(\.\d*)?|\.\d+)$/.test(s))return NaN;return Number(s)};
const optNum=v=>String(v==null?'':v).trim()===''?0:parseNum(v);
const nz=n=>Number.isFinite(n)?n:0;
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const num2=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>num2(n)+' ج.م';
const strNum=n=>String(r2(n));
const pad=n=>String(n).padStart(4,'0');
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const safeId=id=>/^[A-Za-z0-9_-]{1,40}$/.test(String(id))?String(id):uid();
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?`${m[3]}/${m[2]}/${m[1]}`:''};
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(new Date(s+'T00:00:00'));
const validPhone=p=>p===''||/^[0-9+\-\s()]{6,20}$/.test(toEn(p));

/* ============ Data layer ============ */
const defaults=()=>({version:1,settings:{name:'',logo:'',phone:'',address:'',currency:'EGP',prefix:'INV-',counter:1,title:'فاتورة',footer:'شكراً لتعاملكم معنا',terms:'',taxNo:'',author:'',recCounter:1,showSign:true,lastBackup:''},customers:[],invoices:[],payments:[],authors:[]});

function normalize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.invoices)||!Array.isArray(d.customers))return null;
  const out=defaults(),D=out.settings,s=(d.settings&&typeof d.settings==='object')?d.settings:{};
  for(const k of ['name','phone','address','prefix','title','footer','terms','taxNo','author'])if(typeof s[k]==='string')D[k]=s[k].slice(0,500);
  if(typeof s.logo==='string'&&s.logo.startsWith('data:image/'))D.logo=s.logo;
  D.showSign=s.showSign!==false;
  D.counter=Math.max(1,parseInt(s.counter,10)||1);D.recCounter=Math.max(1,parseInt(s.recCounter,10)||1);
  D.lastBackup=typeof s.lastBackup==='string'?s.lastBackup:'';
  const cids=new Set();
  out.customers=d.customers.filter(c=>c&&typeof c==='object').map(c=>{
    let id=safeId(c.id);while(cids.has(id))id=uid();cids.add(id);
    return{id,name:String(c.name||'').trim().slice(0,100),phone:String(c.phone||'').slice(0,30),address:String(c.address||'').slice(0,300)};
  }).filter(c=>c.name);
  const nos=new Set(),iids=new Set();let maxSeq=0;
  for(const i of d.invoices){
    if(!i||typeof i!=='object'||!Array.isArray(i.items))continue;
    const items=i.items.slice(0,300).map(t=>({name:String(t&&t.name||'').trim().slice(0,200),desc:String(t&&t.desc||'').slice(0,500),qty:Number(t&&t.qty),price:Number(t&&t.price)}))
      .filter(t=>t.name&&Number.isFinite(t.qty)&&t.qty>0&&Number.isFinite(t.price)&&t.price>=0);
    if(!items.length)continue;
    let no=String(i.no||'').slice(0,40);
    if(!no||nos.has(no))no=D.prefix+pad(D.counter++);
    nos.add(no);
    const m=/(\d+)$/.exec(no);const seq=m?parseInt(m[1],10):0;if(seq>maxSeq)maxSeq=seq;
    let id=safeId(i.id);while(iids.has(id))id=uid();iids.add(id);
    const name=String(i.customerName||'').trim().slice(0,100)||'عميل';
    let cust=out.customers.find(c=>c.id===i.customerId)||out.customers.find(c=>c.name.toLowerCase()===name.toLowerCase());
    if(!cust){cust={id:uid(),name,phone:String(i.phone||'').slice(0,30),address:''};out.customers.push(cust);}
    const clampN=v=>{v=Number(v);return Number.isFinite(v)&&v>0?v:0};
    const inv={id,no,seq:Number.isFinite(Number(i.seq))?Number(i.seq):seq,date:isDate(i.date)?i.date:today(),customerId:cust.id,customerName:name,phone:String(i.phone||'').slice(0,30),
      items,discType:i.discType==='percent'?'percent':'amount',discount:clampN(i.discount),extra:clampN(i.extra),paid:clampN(i.paid),notes:String(i.notes||'').slice(0,1000),author:String(i.author||'').trim().slice(0,60),createdAt:Number(i.createdAt)||Date.now()};
    if(inv.discType==='percent')inv.discount=Math.min(inv.discount,100);
    if(inv.paid>1e12)inv.paid=1e12;inv.prevBal=Number.isFinite(Number(i.prevBal))?r2(Number(i.prevBal)):0;
    out.invoices.push(inv);
  }
  D.counter=Math.max(D.counter,maxSeq+1);
  const pnos=new Set(),pids=new Set();let maxRec=0;
  for(const p of (Array.isArray(d.payments)?d.payments:[])){
    if(!p||typeof p!=='object')continue;
    const amount=Number(p.amount);if(!Number.isFinite(amount)||amount<=0||amount>1e12)continue;
    const pname=String(p.customerName||'').trim().slice(0,100)||'عميل';
    let cust=out.customers.find(c=>c.id===p.customerId)||out.customers.find(c=>c.name.toLowerCase()===pname.toLowerCase());
    if(!cust){cust={id:uid(),name:pname,phone:'',address:''};out.customers.push(cust)}
    let no=String(p.no||'').slice(0,40);
    if(!no||pnos.has(no)){do{no='REC-'+pad(D.recCounter++)}while(pnos.has(no))}
    pnos.add(no);const mm=/(\d+)$/.exec(no);const sq=mm?parseInt(mm[1],10):0;if(sq>maxRec)maxRec=sq;
    let pid=safeId(p.id);while(pids.has(pid))pid=uid();pids.add(pid);
    out.payments.push({id:pid,no,date:isDate(p.date)?p.date:today(),customerId:cust.id,customerName:cust.name,amount:r2(amount),note:String(p.note||'').slice(0,500),author:String(p.author||'').trim().slice(0,60),prevBal:Number.isFinite(Number(p.prevBal))?r2(Number(p.prevBal)):0,createdAt:Number(p.createdAt)||Date.now()});
  }
  D.recCounter=Math.max(D.recCounter,maxRec+1);
  const anames=new Set(),aids=new Set();
  out.authors=(Array.isArray(d.authors)?d.authors:[]).filter(a=>a&&typeof a==='object'&&String(a.name||'').trim()).map(a=>{let id=safeId(a.id);while(aids.has(id))id=uid();aids.add(id);return{id,name:String(a.name).trim().slice(0,60)}}).filter(a=>{const k=a.name.toLowerCase();if(anames.has(k))return false;anames.add(k);return true});
  return out;
}

function load(){try{const r=localStorage.getItem(KEY);if(!r)return defaults();return normalize(JSON.parse(r))||defaults()}catch(e){return defaults()}}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));if(window.Cloud&&window.Cloud.push)window.Cloud.push();return true}catch(e){toast('تعذر حفظ البيانات: مساحة التخزين ممتلئة أو غير متاحة في هذا المتصفح','error');return false}}

function calc(inv){
  const sub=r2(inv.items.reduce((a,it)=>a+r2(it.qty*it.price),0));
  const disc=inv.discType==='percent'?r2(sub*Math.min(inv.discount,100)/100):Math.min(r2(inv.discount),sub);
  const extra=r2(inv.extra);
  const net=r2(sub-disc+extra);
  const paid=r2(inv.paid);
  const bal=r2(net-paid);
  const rem=Math.max(bal,0);
  const status=rem<=0?'paid':(paid>0?'partial':'unpaid');
  return{sub,disc,extra,net,paid,rem,bal,status};
}
const sortInv=(a,b)=>((b.seq||0)-(a.seq||0))||((b.createdAt||0)-(a.createdAt||0));
const findInv=id=>db.invoices.find(i=>i.id===id);
const findCust=id=>db.customers.find(c=>c.id===id);
const FUTURE={id:null,createdAt:Infinity};
const custBal=(cid,ref)=>{ref=ref||FUTURE;const before=x=>x.id!==ref.id&&(x.createdAt||0)<(ref.createdAt||0);
  const a=db.invoices.filter(i=>i.customerId===cid&&before(i)).reduce((s,i)=>s+calc(i).bal,0);
  const b=db.payments.filter(p=>p.customerId===cid&&before(p)).reduce((s,p)=>s+p.amount,0);
  return r2(a-b)};
const findPay=id=>db.payments.find(p=>p.id===id);
function nextRec(){const s=db.settings;let n=s.recCounter||1;while(db.payments.some(p=>p.no==='REC-'+pad(n)))n++;return{no:'REC-'+pad(n),seq:n}}
function upsertAuthor(name){name=String(name||'').trim().slice(0,60);if(!name)return;if(!db.authors.some(a=>a.name.toLowerCase()===name.toLowerCase()))db.authors.push({id:uid(),name})}

function nextNo(){
  const s=db.settings;let n=s.counter;

function openModal(html,opts={}){

  back.innerHTML=`<div class="modal ${opts.wide?'wide':''} ${opts.small?'sm':''}" role="dialog" aria-modal="true">${html}</div>`;
  back._onClose=opts.onClose;

}

  if(!validPhone(f.phone.trim()))return setErr($('#fPhone'),'رقم الهاتف غير صحيح');
  if(!f.author.trim())return setErr($('#fAuthor'),'يرجى إدخال اسم محرر الفاتورة (حُررت بواسطة)');
  const items=[];
  for(let i=0;i<f.items.length;i++){
    const it=f.items[i],q=parseNum(it.qty),p=parseNum(it.price);
    const row=n=>$(`[data-f="${n}"][data-i="${i}"]`);
    if(!it.name.trim())return setErr(row('name'),`البند رقم ${i+1}: اسم المنتج أو الخدمة مطلوب`);
    if(!(q>0))return setErr(row('qty'),`البند رقم ${i+1}: الكمية يجب أن تكون رقماً أكبر من صفر`);
    if(q>1e7)return setErr(row('qty'),`البند رقم ${i+1}: الكمية كبيرة جداً`);
    if(!(p>=0))return setErr(row('price'),`البند رقم ${i+1}: سعر الوحدة غير صحيح`);
    if(p>1e9)return setErr(row('price'),`البند رقم ${i+1}: السعر كبير جداً`);
    items.push({name:it.name.trim(),desc:it.desc.trim(),qty:q,price:p});
  }
  const disc=optNum(f.discount),extra=optNum(f.extra);
  if(!(disc>=0))return setErr($('#fDisc'),'قيمة الخصم غير صحيحة');
  if(!(extra>=0))return setErr($('#fExtra'),'قيمة المصاريف الإضافية غير صحيحة');
  if(f.discType==='percent'&&disc>100)return setErr($('#fDisc'),'نسبة الخصم لا يمكن أن تتجاوز 100%');
  const base={items,discType:f.discType,discount:disc,extra,paid:0};
  const c0=calc(base);
  if(f.discType==='amount'&&disc>c0.sub)return setErr($('#fDisc'),'الخصم أكبر من إجمالي البنود');
  if(!(c0.net>0))return setErr(null,'صافي الفاتورة يجب أن يكون أكبر من صفر');
  let paid=optNum(f.paid);
  if(!(paid>=0))return setErr($('#fPaid'),'المبلغ المدفوع غير صحيح');
  if(f.status==='paid')paid=f.keepPaid?Math.max(paid,c0.net):c0.net;
  else if(f.status==='unpaid')paid=0;
  else if(!(paid>0&&paid<c0.net))return setErr($('#fPaid'),'في حالة الدفع الجزئي يجب أن يكون المبلغ المدفوع أكبر من صفر وأقل من صافي الفاتورة');
  if(paid>1e12)return setErr($('#fPaid'),'المبلغ المدفوع كبير جداً');
  paid=r2(paid);

  // customer upsert
  let cust=db.customers.find(c=>c.name.toLowerCase()===cname.toLowerCase());
  const phone=toEn(f.phone.trim());
  if(!cust){cust={id:uid(),name:cname,phone,address:''};db.customers.push(cust)}
  else if(!cust.phone&&phone)cust.phone=phone;

  const prevBal=custBal(cust.id,(f.id&&findInv(f.id))||FUTURE);
  const common={date:f.date,customerId:cust.id,customerName:cust.name,phone,items,discType:f.discType,discount:disc,extra,paid,prevBal,author:f.author.trim().slice(0,60),notes:f.notes.trim()};
  upsertAuthor(f.author);
  let saved;
  if(f.id){
    const idx=db.invoices.findIndex(i=>i.id===f.id);
    if(idx<0)return setErr(null,'الفاتورة غير موجودة');
    saved=Object.assign({},db.invoices[idx],common,{updatedAt:Date.now()});db.invoices[idx]=saved;
  }else{
    const n=nextNo();
    saved=Object.assign({id:uid(),no:n.no,seq:n.seq,createdAt:Date.now()},common);
    db.invoices.push(saved);db.settings.counter=n.seq+1;
  }
  if(!save())return null;
  toast(f.id?'تم حفظ التعديلات':`تم حفظ الفاتورة ${saved.no}`,'ok');
  form=null;go('invoices');viewInvoice(saved.id);
  return saved;
}

/* ============ Export as JPG (no external libraries) ============ */
let _fontCss=null;
async function exportFontCss(){
  if(_fontCss!==null)return _fontCss;
  _fontCss='';
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),6000);
    const css=await (await fetch('https://fonts.googleapis.com/css2?family=Cairo:wght@400..800&display=swap',{signal:ctl.signal})).text();
    clearTimeout(t);
    const blocks=[...css.matchAll(/\/\*\s*([\w-]+)\s*\*\/\s*@font-face\s*\{([^}]*)\}/g)].filter(m=>m[1]==='arabic'||m[1]==='latin');
    const out=[];
    for(const m of blocks){
      const u=/url\((https:[^)]+)\)/.exec(m[2]);if(!u)continue;
      const bytes=new Uint8Array(await (await fetch(u[1])).arrayBuffer());
      let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
      out.push('@font-face{'+m[2].replace(u[0],'url(data:font/woff2;base64,'+btoa(bin)+')')+'}');
    }
    _fontCss=out.join('\n');
  }catch(e){_fontCss=''}
  return _fontCss;
}
async function exportJPG(sheetHTML,name){
  try{
    toast('جاري تجهيز الصورة...');
    const W=794,tmp=document.createElement('div');tmp.innerHTML=sheetHTML;
    const sheet=tmp.firstElementChild;
    sheet.style.cssText='width:'+W+'px;max-width:none;margin:0;border:0;border-radius:0;background:#fff';
    const probe=document.createElement('div');probe.style.cssText='position:fixed;left:-10000px;top:0;width:'+W+'px;visibility:hidden';
    probe.appendChild(sheet.cloneNode(true));document.body.appendChild(probe);
    const H=Math.ceil(probe.firstElementChild.getBoundingClientRect().height)+24;probe.remove();
    const fonts=await exportFontCss();
    const css=(fonts+'\n'+document.querySelector('style').textContent).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" lang="ar" style="width:${W}px;height:${H}px;background:#fff;color:#111;font-family:'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif"><style>${css}</style>${new XMLSerializer().serializeToString(sheet)}</div></foreignObject></svg>`;
    const u8=new TextEncoder().encode(svg);let bin='';for(let i=0;i<u8.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
    const url='data:image/svg+xml;base64,'+btoa(bin);
    window.__lastExportSvg=svg;
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('img'));img.src=url});
    const scale=Math.min(2,16000/H),cv=document.createElement('canvas');
    cv.width=Math.round(W*scale);cv.height=Math.round(H*scale);
    const cx=cv.getContext('2d'),paint=()=>{cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height)};
    paint();await new Promise(r=>setTimeout(r,150));paint();
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
    if(!blob)throw new Error('blob');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=String(name).replace(/[\\/:*?\"<>|\s]+/g,'_')+'.jpg';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    toast('تم حفظ الصورة','ok');
  }catch(e){console.warn('exportJPG failed:',e&&e.name,e&&e.message);toast('تعذر حفظ الصورة على هذا المتصفح. استخدم زر الطباعة ثم «حفظ كملف PDF».','error')}
}

let stmt={cid:null,from:'',to:''};
function stmtRows(cid,from,to){
  const docs=[];
  db.invoices.filter(i=>i.customerId===cid).forEach(i=>docs.push({date:i.date,t:i.createdAt||0,kind:'inv',x:i}));
  db.payments.filter(p=>p.customerId===cid).forEach(p=>docs.push({date:p.date,t:p.createdAt||0,kind:'pay',x:p}));
  docs.sort((a,b)=>a.date.localeCompare(b.date)||a.t-b.t);
  const eff=d=>d.kind==='inv'?calc(d.x).bal:-d.x.amount;
  let opening=0;if(from)docs.filter(d=>d.date<from).forEach(d=>{opening+=eff(d)});opening=r2(opening);
  const list=docs.filter(d=>(!from||d.date>=from)&&(!to||d.date<=to));
  let run=opening,sales=0,paidInv=0,paidPay=0;const rows=[];
  list.forEach(d=>{
    if(d.kind==='inv'){
      const i=d.x,k=calc(i);let first=true;
      const push=r=>{rows.push(Object.assign({first,date:first?i.date:'',ref:first?i.no:''},r));first=false};
      i.items.forEach(t=>push({text:t.name,desc:t.desc,qty:Number(t.qty),price:t.price,debit:r2(t.qty*t.price),credit:0}));
      if(k.disc>0)push({adj:1,text:'خصم'+(i.discType==='percent'?` (${Number(i.discount)}%)`:''),credit:k.disc,debit:0});
      if(k.extra>0)push({adj:1,text:'مصاريف إضافية',debit:k.extra,credit:0});
      if(k.paid>0)push({adj:1,text:'المدفوع عند الفاتورة',credit:k.paid,debit:0});
      run=r2(run+k.bal);rows[rows.length-1].bal=run;sales+=k.net;paidInv+=k.paid;
    }else{
      const p=d.x;run=r2(run-p.amount);
      rows.push({first:true,date:p.date,ref:p.no,text:'دفعة مستلمة',desc:p.note||'',debit:0,credit:p.amount,bal:run});paidPay+=p.amount;
    }
  });
  return{rows,opening,closing:run,sales:r2(sales),paidInv:r2(paidInv),paidPay:r2(paidPay),count:list.length};
}

/* ============ Reports ============ */
function repRange(){
  if(rep.mode==='daily')return{from:rep.day,to:rep.day,label:`تقرير المبيعات اليومي – ${fmtDate(rep.day)}`};
  if(rep.mode==='monthly'){
    const m=String(rep.month).padStart(2,'0'),last=new Date(rep.year,rep.month,0).getDate();
    return{from:`${rep.year}-${m}-01`,to:`${rep.year}-${m}-${String(last).padStart(2,'0')}`,label:`تقرير المبيعات الشهري – ${MONTHS[rep.month-1]} ${rep.year}`};
  }
  return{from:rep.from,to:rep.to,label:`تقرير المبيعات من ${fmtDate(rep.from)} إلى ${fmtDate(rep.to)}`};
}
function repData(){
  const r=repRange();
  if(!isDate(r.from)||!isDate(r.to))return{error:'يرجى اختيار تاريخ صحيح'};
  if(r.from>r.to)return{error:'تاريخ البداية يجب أن يكون قبل تاريخ النهاية'};
  const list=db.invoices.filter(i=>i.date>=r.from&&i.date<=r.to).sort((a,b)=>a.date.localeCompare(b.date)||(a.seq||0)-(b.seq||0));
  let s=0,p=0,rm=0;const days={};
  const pays=db.payments.filter(x=>x.date>=r.from&&x.date<=r.to).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  const paySum=r2(pays.reduce((a,x)=>a+x.amount,0));
  list.forEach(i=>{const c=calc(i);s+=c.net;p+=c.paid;rm+=c.rem;const d=days[i.date]||(days[i.date]={n:0,s:0,p:0,r:0});d.n++;d.s+=c.net;d.p+=c.paid;d.r+=c.rem});
  let allRem=0;db.customers.forEach(c=>{const b=custBal(c.id);if(b>0)allRem+=b});
  return{r,list,pays,paySum,sales:r2(s),paid:r2(p),collected:r2(p+paySum),rem:r2(rm),days,allRem:r2(allRem)};
}

function processLogo(file){
  if(!file)return;
  if(!/^image\//.test(file.type))return toast('الملف المختار ليس صورة','error');
  if(file.size>8*1024*1024)return toast('حجم الصورة كبير جداً','error');
  const fr=new FileReader();
  fr.onerror=()=>toast('تعذر قراءة الصورة','error');
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>toast('تعذر فتح الصورة','error');
    img.onload=()=>{
      const max=400,k=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      let url=cv.toDataURL('image/png');if(url.length>400000)url=cv.toDataURL('image/jpeg',.85);
      logoDraft=url;$('#logoPrev').innerHTML=`<img src="${url}" alt="">`;toast('تم تحميل الشعار، اضغط «حفظ الإعدادات» لتثبيته');
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function importData(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onerror=()=>toast('تعذر قراءة الملف','error');
  fr.onload=async()=>{
    let data=null;try{data=normalize(JSON.parse(fr.result))}catch(e){}
    if(!data)return toast('الملف غير صالح: ليس نسخة احتياطية من هذا النظام','error');
    const ok=await confirmBox({title:'استيراد النسخة الاحتياطية',msg:`سيتم استبدال بياناتك الحالية بـ ${data.invoices.length} فاتورة و${data.customers.length} عميل من الملف. هل تريد المتابعة؟`,ok:'استيراد واستبدال'});

    db=data;if(!save())return;toast('تم استيراد البيانات بنجاح','ok');form=null;go('dashboard');
  };
  fr.readAsText(file);
}

document.addEventListener('click',async e=>{

  switch(a){
    case 'nav':closeAllModals();go(b.dataset.page);break;

    case 'modal-close':closeModal(b.closest('.mback'));break;

        db.invoices=db.invoices.filter(i=>i.id!==id);if(save()){toast('تم حذف الفاتورة','ok');closeAllModals();render()}
      }break}

    case 'cust-edit':custModal(id);break;

    case 'cloud-signout':{
      const C=window.Cloud;await C.flush();const bad=C.status==='error';
      if(await confirmBox({title:'تسجيل الخروج',msg:bad?'يوجد تغييرات لم تُرفع للسحابة بسبب خطأ في الاتصال، وستُفقد إذا خرجت الآن. هل تريد الخروج؟':'سيتم تسجيل الخروج ومسح نسخة البيانات من هذا الجهاز (بياناتك محفوظة في السحابة).',ok:'تسجيل الخروج',danger:bad}))C.signOut();
      break}
    case 'cloud-sync':if(window.Cloud)window.Cloud.syncNow();break;
    case 'stmt-open':stmtOpen(id);break;
    case 'stmt-range':{
      if(b.dataset.r==='all'){stmt.from='';stmt.to=''}
      else{const t=today();stmt.from=t.slice(0,8)+'01';stmt.to=t}
      const f=$('#stFrom'),e2=$('#stTo');if(f)f.value=stmt.from;if(e2)e2.value=stmt.to;stmtRefresh();break}
    case 'stmt-print':{
      if(stmtCheck())break;const c=findCust(stmt.cid);
      toast('اختر «حفظ كملف PDF» من نافذة الطباعة لحفظ كشف الحساب');
      printHTML(statementHTML(stmt.cid,stmt.from,stmt.to),'كشف-حساب-'+(c?c.name:''));break}
    case 'stmt-jpg':{if(stmtCheck())break;const c=findCust(stmt.cid);exportJPG(statementHTML(stmt.cid,stmt.from,stmt.to),'كشف-حساب-'+(c?c.name:''));break}
    case 'inv-jpg':{const inv=findInv(id);if(inv)exportJPG(invoiceHTML(inv),inv.no);break}
    case 'pay-jpg':{const p=findPay(id);if(p)exportJPG(receiptHTML(p),p.no);break}
    case 'pay-add':payModal(id||null);break;
    case 'pay-view':payView(id);break;
    case 'pay-print':{const p=findPay(id);if(!p)break;toast('اختر «حفظ كملف PDF» من نافذة الطباعة لحفظ الإيصال');printHTML(receiptHTML(p),`إيصال-${p.no}`);break}
    case 'pay-del':{
      const p=findPay(id);if(!p)break;
      if(await confirmBox({title:'حذف الدفعة',msg:`هل أنت متأكد من حذف الدفعة ${p.no} بقيمة ${money(p.amount)}؟ سيعود المبلغ إلى حساب العميل ${p.customerName}.`,ok:'نعم، احذف'})){
        db.payments=db.payments.filter(x=>x.id!==id);
        if(save()){toast('تم حذف الدفعة','ok');closeAllModals();render();custView(p.customerId)}
      }break}
    case 'author-del':{db.authors=db.authors.filter(a=>a.id!==id);if(save()){const e=$('#authChips');if(e)e.innerHTML=authChips()}break}
    case 'export':exportData();break;
    case 'import-pick':$('#importFile').click();break;
    case 'reset':
      if(await confirmBox({title:'حذف جميع البيانات',msg:'سيتم حذف كل الفواتير والعملاء والإعدادات نهائياً من هذا الجهاز'+(window.Cloud&&window.Cloud.user?' ومن السحابة أيضاً':'')+'. يُنصح بتصدير نسخة احتياطية أولاً. هل تريد المتابعة؟',ok:'نعم، احذف كل شيء'})){
        db=defaults();if(save()){form=null;toast('تم حذف جميع البيانات','ok');go('dashboard')}
      }break;
  }
});
$('#overlay').addEventListener('click',closeMenu);

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.st!==undefined){stmt[t.dataset.st]=t.value;stmtRefresh();return}
  if(t.dataset.filter!==undefined){filt[t.dataset.filter]=t.value;const l=$('#invList');if(l)l.innerHTML=invList();return}
  if(t.dataset.cq!==undefined){custQ.q=t.value;$('#custList2').innerHTML=custList();return}
  if(t.dataset.f===undefined||!form||page!=='new')return;
  const f=t.dataset.f;
  if(t.dataset.i!==undefined){form.items[+t.dataset.i][f]=t.value;updateForm();return}
  form[f]=t.value;
  if(f==='customerName'){
    const c=db.customers.find(x=>x.name.toLowerCase()===t.value.trim().toLowerCase());
    if(c&&!form.phone.trim()&&c.phone){form.phone=c.phone;$('#fPhone').value=c.phone}
  }
  if(f==='paid'){
    const net=calc(formInv()).net,p=optNum(t.value);
    form.keepPaid=p>net;form.status=(p>=net&&net>0)?'paid':(p>0?'partial':'unpaid');
  }
  updateForm();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fStatus'&&form){
    form.status=t.value;form.keepPaid=false;const net=calc(formInv()).net;
    if(t.value==='paid')form.paid=strNum(net);
    else if(t.value==='unpaid')form.paid='0';
    else{const p=optNum(form.paid);if(!(p>0&&p<net))form.paid='';}
    const pi=$('#fPaid');pi.value=form.paid;updateForm();if(t.value==='partial')pi.focus();return;
  }
  if(t.dataset.rep){const k=t.dataset.rep;rep[k]=(k==='month'||k==='year')?parseInt(t.value,10):t.value;refreshReport();return}
  if(t.id==='logoFile'){processLogo(t.files[0]);t.value='';return}
  if(t.id==='importFile'){importData(t.files[0]);t.value='';return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const m=$$('.mback');if(m.length)closeModal(m[m.length-1])}
});

render();
})();
</script>

<script type="module">
const firebaseConfig={
  apiKey:"AIzaSyCOsjbFfQbgljIX3swd0SJIV6IkRYs0MDY",
  authDomain:"invoices-app-fa669.firebaseapp.com",
  projectId:"invoices-app-fa669",
  storageBucket:"invoices-app-fa669.firebasestorage.app",
  messagingSenderId:"555127727954",
  appId:"1:555127727954:web:1ad568ddb21e29272a3c8b"
};
// البريد الثابت للمستخدم الوحيد (لا يُكتب في الشاشة، المستخدم يكتب كلمة السر فقط)
const LOGIN_EMAIL='owner@invoices-app-fa669.firebaseapp.com';
const B=window.AppBridge;
const C=window.Cloud={status:'loading',user:null,msg:'',lastSync:'',push(){},flush:async()=>{},signOut(){},syncNow(){},changePassword:async()=>''};
const root=document.documentElement,$q=s=>document.querySelector(s);
const emit=()=>window.dispatchEvent(new Event('cloud-state'));
const setSt=(s,m='')=>{C.status=s;C.msg=m;if(s==='synced')C.lastSync=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});emit()};
const UIDKEY='acc_cloud_uid';
function gate(mode,msg){
  if(location.protocol==='file:')return;
  root.classList.toggle('gated',mode!=='open');
  $q('#gLoad').hidden=!(mode==='loading'||mode==='error');
  $q('#gLoadTxt').textContent=mode==='error'?msg:'جاري التحميل...';
  $q('#gRetry').hidden=mode!=='error';
  $q('#gForm').hidden=mode!=='form';
  if(mode==='form')setTimeout(()=>$q('#gPass').focus(),50);
}
const authMsg=(c,fallback)=>({
  'auth/invalid-credential':'كلمة السر غير صحيحة',
  'auth/wrong-password':'كلمة السر غير صحيحة',
  'auth/invalid-login-credentials':'كلمة السر غير صحيحة',
  'auth/user-not-found':'المستخدم غير موجود: أنشئه من Firebase ← Authentication ← Users',
  'auth/too-many-requests':'محاولات خاطئة كثيرة، انتظر قليلاً ثم أعد المحاولة',
  'auth/network-request-failed':'لا يوجد اتصال بالإنترنت',
  'auth/operation-not-allowed':'فعّل طريقة Email/Password من Firebase ← Authentication ← Sign-in method',
  'auth/unauthorized-domain':'هذا النطاق غير مصرح به: أضفه من Firebase ← Authentication ← Settings ← Authorized domains',
  'auth/weak-password':'كلمة السر ضعيفة (8 أحرف على الأقل)',
  'auth/requires-recent-login':'سجّل الدخول مرة أخرى ثم أعد المحاولة'
}[c]||fallback||'تعذر تسجيل الدخول');
(async()=>{
  if(location.protocol==='file:'){setSt('unavailable');return}
  let A,F,auth,fs;
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    A=authM;F=fsM;const app=appM.initializeApp(firebaseConfig);auth=A.getAuth(app);fs=F.getFirestore(app);
  }catch(e){setSt('unavailable');gate('error','تعذر الاتصال بخدمة الحماية. تأكد من الإنترنت ثم أعد المحاولة.');return}

  let uid=null,active=false,busy=false,synced=new Map(),unsubs=[],timer=null,retry=null;
  const sort=v=>Array.isArray(v)?v.map(sort):(v&&typeof v==='object')?Object.keys(v).sort().reduce((o,k)=>(o[k]=sort(v[k]),o),{}):v;
  const sk=o=>JSON.stringify(sort(o));
  const clean=o=>JSON.parse(JSON.stringify(o));
  const toDocs=d=>{const m=new Map();m.set('settings/main',clean(d.settings));d.customers.forEach(c=>m.set('customers/'+c.id,clean(c)));d.invoices.forEach(i=>m.set('invoices/'+i.id,clean(i)));(d.payments||[]).forEach(p=>m.set('payments/'+p.id,clean(p)));(d.authors||[]).forEach(a=>m.set('authors/'+a.id,clean(a)));return m};
  const ref=k=>{const p=k.split('/');return F.doc(fs,'users',uid,p[0],p[1])};
  const friendly=e=>{
    const c=(e&&e.code)||'';
    if(c.includes('permission-denied'))return 'تم رفض الوصول: تأكد من نشر قواعد الأمان في Firestore';
    if(c.includes('unavailable')||c.includes('network'))return 'لا يوجد اتصال بالإنترنت';
    return (e&&e.message)||'خطأ غير معروف';
  };
  function stop(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];active=false;clearTimeout(timer);clearTimeout(retry);synced=new Map()}

  async function fetchCloud(){
    const names=['settings','customers','invoices','payments','authors'];
    const out={settings:null,customers:[],invoices:[],payments:[],authors:[],map:new Map()};
    const snaps=await Promise.all(names.map(n=>F.getDocs(F.collection(fs,'users',uid,n))));
    snaps.forEach((sn,idx)=>sn.forEach(d=>{
      const data=d.data(),n=names[idx];out.map.set(n+'/'+d.id,sk(data));
      if(n==='settings'){if(d.id==='main')out.settings=data}else out[n].push(data);
    }));
    return out;
  }
  const fromCloud=c=>B.normalize({settings:c.settings||{},customers:c.customers,invoices:c.invoices,payments:c.payments,authors:c.authors});
  function merge(l,c){
    const stamp=x=>x.updatedAt||x.createdAt||0;
    const byId=(la,ca)=>{const m=new Map();la.forEach(x=>m.set(x.id,x));ca.forEach(x=>{const o=m.get(x.id);m.set(x.id,o&&stamp(o)>=stamp(x)?o:x)});return [...m.values()]};
    const cs=c.settings||{};
    const st=Object.assign({},cs.name?cs:l.settings);
    st.counter=Math.max(l.settings.counter||1,cs.counter||1);st.recCounter=Math.max(l.settings.recCounter||1,cs.recCounter||1);
    const byName=new Map(),idMap=new Map();
    [...c.customers,...l.customers].forEach(x=>{const k=String(x.name).trim().toLowerCase();if(!byName.has(k))byName.set(k,x);idMap.set(x.id,byName.get(k).id)});
    const inv=byId(l.invoices,c.invoices).map(i=>Object.assign({},i,{customerId:idMap.get(i.customerId)||i.customerId}));
    const pays=byId(l.payments||[],c.payments||[]).map(p=>Object.assign({},p,{customerId:idMap.get(p.customerId)||p.customerId}));
    return B.normalize({settings:st,customers:[...byName.values()],invoices:inv,payments:pays,authors:[...(c.authors||[]),...(l.authors||[])]});
  }

  async function doPush(){
    if(!active)return;
    const cur=toDocs(B.getDB()),ops=[],prev=new Map();
    cur.forEach((v,k)=>{const s=sk(v);if(synced.get(k)!==s)ops.push({k,v,s,del:false})});
    synced.forEach((s,k)=>{if(!cur.has(k))ops.push({k,del:true})});
    if(!ops.length)return;
    ops.forEach(o=>{prev.set(o.k,synced.get(o.k));if(o.del)synced.delete(o.k);else synced.set(o.k,o.s)});
    setSt('syncing');
    try{
      for(let i=0;i<ops.length;i+=400){
        const b=F.writeBatch(fs);
        ops.slice(i,i+400).forEach(o=>{if(o.del)b.delete(ref(o.k));else b.set(ref(o.k),o.v)});
        await b.commit();
      }
      if(active)setSt('synced');
    }catch(e){
      ops.forEach(o=>{const p=prev.get(o.k);if(p===undefined)synced.delete(o.k);else synced.set(o.k,p)});
      setSt('error',friendly(e));
      clearTimeout(retry);retry=setTimeout(()=>{if(active)doPush()},15000);
    }
  }

  function listen(){
    ['settings','customers','invoices','payments','authors'].forEach(n=>{
      unsubs.push(F.onSnapshot(F.collection(fs,'users',uid,n),snap=>{
        if(!active)return;
        const cur=B.getDB();
        const w={settings:Object.assign({},cur.settings),customers:cur.customers.slice(),invoices:cur.invoices.slice(),payments:(cur.payments||[]).slice(),authors:(cur.authors||[]).slice()};
        let changed=false;
        snap.docChanges().forEach(x=>{
          if(x.doc.metadata.hasPendingWrites)return;
          const key=n+'/'+x.doc.id;
          if(x.type==='removed'){
            if(!synced.has(key))return;
            synced.delete(key);changed=true;
            if(n!=='settings')w[n]=w[n].filter(o=>o.id!==x.doc.id);
            return;
          }
          const d=x.doc.data(),s=sk(d);
          if(synced.get(key)===s)return;
          synced.set(key,s);changed=true;
          if(n==='settings'){if(x.doc.id==='main')w.settings=Object.assign({},w.settings,d)}
          else{const i=w[n].findIndex(o=>o.id===x.doc.id);if(i>=0)w[n][i]=d;else w[n].push(d)}
        });
        if(changed){const nd=B.normalize(w);if(nd)B.setDB(nd)}
      },e=>setSt('error',friendly(e))));
    });
  }

  async function startSync(){
    if(busy)return;busy=true;stop();
    try{
      setSt('syncing');
      const cloud=await fetchCloud();
      const local=B.getDB(),lm=toDocs(local);
      let result=local;
      if(cloud.map.size){
        const same=cloud.map.size===lm.size&&[...lm].every(([k,v])=>cloud.map.get(k)===sk(v));
        if(!same){
          if(B.isEmpty())result=fromCloud(cloud);
          else{
            const prevUid=localStorage.getItem(UIDKEY);
            const ch=await B.chooseSync({cloud:{inv:cloud.invoices.length,cus:cloud.customers.length},local:{inv:local.invoices.length,cus:local.customers.length},other:!!prevUid&&prevUid!==uid});
            if(ch==='cancel'){setSt('paused');busy=false;return}
            if(ch==='cloud')result=fromCloud(cloud);
            else if(ch==='merge')result=merge(local,cloud);
          }
        }
      }
      try{localStorage.setItem(UIDKEY,uid)}catch(e){}
      synced=new Map(cloud.map);active=true;
      B.setDB(result);
      await doPush();
      listen();
      if(C.status!=='error')setSt('synced');
    }catch(e){setSt('error',friendly(e))}
    busy=false;
  }

  C.push=()=>{if(!active)return;clearTimeout(timer);timer=setTimeout(doPush,600)};
  C.flush=async()=>{clearTimeout(timer);if(active)await doPush()};
  C.syncNow=()=>{if(!C.user)return;if(active){clearTimeout(retry);doPush()}else startSync()};
  C.signOut=async()=>{stop();B.wipe();try{localStorage.removeItem(UIDKEY)}catch(e){}await A.signOut(auth)};
  C.changePassword=async(cur,nw)=>{
    try{
      const cred=A.EmailAuthProvider.credential(LOGIN_EMAIL,cur);
      await A.reauthenticateWithCredential(auth.currentUser,cred);
      await A.updatePassword(auth.currentUser,nw);
      return '';
    }catch(e){
      const c=(e&&e.code)||'';
      return (c==='auth/invalid-credential'||c==='auth/wrong-password')?'كلمة السر الحالية غير صحيحة':authMsg(c,'تعذر تغيير كلمة السر');
    }
  };

  // login form
  const msgEl=$q('#gMsg'),btn=$q('#gBtn');
  $q('#gForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const pass=$q('#gPass').value;
    if(!pass){msgEl.textContent='اكتب كلمة السر';return}
    msgEl.textContent='';btn.disabled=true;btn.textContent='جاري الدخول...';
    try{
      await A.setPersistence(auth,$q('#gRemember').checked?A.browserLocalPersistence:A.browserSessionPersistence);
      await A.signInWithEmailAndPassword(auth,LOGIN_EMAIL,pass);
      $q('#gPass').value='';
    }catch(err){
      msgEl.textContent=authMsg(err&&err.code);$q('#gPass').select();
    }
    btn.disabled=false;btn.textContent='دخول';
  });

  A.onAuthStateChanged(auth,u=>{
    stop();
    if(u){uid=u.uid;C.user={email:u.email};gate('open');startSync()}
    else{uid=null;C.user=null;setSt('out');gate('form')}
  });
  window.addEventListener('online',()=>{if(active)doPush()});
})();
</script>
